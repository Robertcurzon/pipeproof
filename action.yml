name: PipeProof Data Contract Check
description: Validate a current data batch against a baseline and quarantine invalid rows.
inputs:
  current:
    description: Path to the current CSV, Parquet, JSON, or JSONL batch.
    required: true
  baseline:
    description: Path to the accepted baseline batch.
    required: true
  dataset-name:
    description: Logical dataset name included in reports.
    required: false
    default: incoming_batch
  metric-catalog:
    description: Optional MetricFoundry YAML catalog evaluated against accepted rows.
    required: false
    default: ""
  metric-group-by:
    description: Optional comma-separated governed dimensions.
    required: false
    default: ""
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    - shell: bash
      run: pip install "${{ github.action_path }}"
    - shell: bash
      run: |
        args=(
          check "${{ inputs.current }}"
          --baseline "${{ inputs.baseline }}"
          --name "${{ inputs.dataset-name }}"
          --output pipeproof-artifacts
        )
        if [[ -n "${{ inputs.metric-catalog }}" ]]; then
          args+=(--metrics "${{ inputs.metric-catalog }}")
        fi
        if [[ -n "${{ inputs.metric-group-by }}" ]]; then
          IFS=',' read -ra dimensions <<< "${{ inputs.metric-group-by }}"
          args+=(--group-by "${dimensions[@]}")
        fi
        pipeproof "${args[@]}"
